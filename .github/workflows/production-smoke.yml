name: Production Smoke Tests

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-smoke-tests
  cancel-in-progress: false

jobs:
  production-smoke:
    name: Production API smoke and isolation tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_URL: https://enterprise-knowledge-agent-main.onrender.com
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run production smoke tests
        run: python backend/scripts/production_smoke_test.py

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-smoke-report
          path: production-smoke-report.json
          if-no-files-found: ignore
          retention-days: 7
